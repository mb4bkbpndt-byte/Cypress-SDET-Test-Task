[pytest]
testpaths = tests browser/tests
addopts = -ra
markers =
    assumption: дополнительная проверка принятого допущения, не заданного контрактом
    concurrency: проверки конкурентной отправки запросов
    contract: проверки контракта Payment API
    idempotency: проверки идемпотентности и повторной отправки запросов
    known_defect: проверки для зарегистрированных дефектов
    smoke: проверка доступности сервиса
    validation: проверки валидации запросов
